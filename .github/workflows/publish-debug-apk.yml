name: Publish debug APK

on:
  push:
    tags:
      - 'novafetch-debug-*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish installable debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Build ABI-specific debug APKs
        run: ./gradlew :app:assembleDebug

      - name: Generate checksums
        run: sha256sum app/build/outputs/apk/debug/app-{armeabi-v7a,arm64-v8a,x86_64}-debug.apk > SHA256SUMS

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-x86_64-debug.apk \
            SHA256SUMS \
            --title "NovaFetch debug APKs (${GITHUB_SHA::7})" \
            --prerelease \
            --notes "Installable debug APKs built from commit ${GITHUB_SHA}. These are not production-signed APKs. Android runtime instrumentation has not passed; use for testing only."
